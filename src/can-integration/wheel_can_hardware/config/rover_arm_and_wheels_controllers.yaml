# Combined controller_manager config: arm motors (joints 1-5) + six-wheel drive.
#
# Both hardware plugins (ArmCanInterface + WheelCanInterface) share the same CAN
# socket via getSharedCanController() — do not also run can_node on the same bus.
#
# Requires:
#   sudo apt install ros-jazzy-forward-command-controller
#   (for forward_command_controller/ForwardCommandController)

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: forward_command_controller/ForwardCommandController

    velocity_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint5
    interface_name: velocity

velocity_controller:
  ros__parameters:
    joints:
      - wheel_right_front
      - wheel_right_mid
      - wheel_right_rear
      - wheel_left_front
      - wheel_left_mid
      - wheel_left_rear
    interface_name: velocity
