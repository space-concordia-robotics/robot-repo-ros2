/**/map_server:
  ros__parameters:
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

/**/map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

/**/planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins:
      - GridBased
    allow_partial_planning: true
    # Humble:
    #GridBased:
    #  plugin: "nav2_navfn_planner/NavfnPlanner"
    #  tolerance: 0.5
    #  use_astar: false
    #  allow_unknown: true
    # Jazzy:
    #GridBased:
    #  plugin: "nav2_navfn_planner::NavfnPlanner"
    #  tolerance: 0.5
    #  use_astar: false
    #  allow_unknown: true
    GridBased:
      # TODO 2026-03-08 (Will Free): optimize these
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      cache_obstacle_heuristic: true
      debug_visualizations: false # DISABLE THIS WHEN NOT DEBUGGING
      goal_heading_mode: "ALL_DIRECTION"

/**/smoother_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1

    # TODO 2026-03-08 (Will Free): consider switching to the Savitzky-Golay Smoother?
    smoother_plugins:
      - simple_smoother
      #- savitzky_golay_smoother

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

    savitzky_golay_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      window_size: 7
      poly_order: 3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: True

/**/behavior_server:
  ros__parameters:
