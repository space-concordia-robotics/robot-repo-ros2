/**/local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # local costmap is 8x8
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.8

      # TODO 2026-02-04 (Will Free): add denoise layer
      # voxel layer is 3d, obstacle layer is 3d
      plugins:
        - voxel_layer
        #- obstacle_layer
        #- spatio_temporal_voxel_layer
        - denoise_layer
        - inflation_layer_near
        - inflation_layer_wide

      # slightly inflate the cost at a greater distance to help with path optimization
      # see: https://arxiv.org/pdf/1706.09068
      inflation_layer_wide:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0 # exponential decay factor for cost inflation
        inflation_radius: 2.5

      # inflate the cost significantly for areas in which the rover will collide
      inflation_layer_near:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0 # exponential decay factor for cost inflation
        inflation_radius: 0.85 # roughly the radius of the rover

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /rover/lidar/scan
          obstacle_max_range: 14.0
          obstacle_min_range: 1.0
          raytrace_max_range: 16.0
          raytrace_min_range: 1.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan # todo: this can contain multiple sources (pointcloud & laserscan)
        scan:
          topic: /rover/lidar/scan/points
          #topic: /ouster/points
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 8.0
          obstacle_min_range: 0.5
          raytrace_max_range: 8.0
          raytrace_min_range: 0.5

      spatio_temporal_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 64.0  # seconds if linear, e^n if exponential
        decay_model: 0     # 0=linear, 1=exponential, -1=persistent
        voxel_size: 0.05  # meters
        track_unknown_space: false  # default space is known
        mark_threshold: 0     # voxel height
        update_footprint_enabled: true
        combination_method: 1     # 1=max, 0=override
        origin_z: 0.0   # meters
        publish_voxel_map: true # default off
        transform_tolerance: 0.2   # seconds
        mapping_mode: false # default off, saves map not for navigation
        map_save_duration: 60.0  # default 60s, how often to autosave
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          data_type: "PointCloud2"
          topic: /rover/lidar/scan/points
          transport_type: "raw"        # default raw -No compression-, Options: zlib, draco, zstd
          marking: true
          clearing: false
          obstacle_range: 12.0          # meters
          min_obstacle_height: 0.3     # default 0, meters
          max_obstacle_height: 2.0     # default 3, meters
          expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false          # default false, for laser scans
          filter: "passthrough"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
          voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
        lidar_clear:
          data_type: "PointCloud2"
          topic: /rover/lidar/scan/points
          transport_type: "raw"        # default raw -No compression-, Options: zlib, draco, zstd
          marking: false
          clearing: true
          min_z: 0.1                  # default 0, meters
          max_z: 16.0                  # default 10, meters
          vertical_fov_angle: 0.5794  # default 0.7, radians
          #vertical_fov_padding: 0.05    # 3D Lidar only. Default 0, in meters
          vertical_fov_offset: 0.0     # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          horizontal_fov_angle: 6.28318 # default 1.04, radians
          decay_acceleration: 5.0     # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 1                # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
          obstacle_max_range: 14.0
          obstacle_min_range: 1.0
          raytrace_max_range: 16.0
          raytrace_min_range: 1.0

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      always_send_full_costmap: False

