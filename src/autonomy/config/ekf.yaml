navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: -1.570796327 # the gazebo IMU seems to use yaw=0 when pointing south.
    zero_altitude: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: true
    datum: [ 45.6707543, -73.7952135, 0.0 ]
